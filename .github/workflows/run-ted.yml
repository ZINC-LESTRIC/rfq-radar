name: Run TED Fetcher + Match

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product description to match (e.g. leather football size 5)'
        required: true
        default: 'leather football size 5'
        type: string

jobs:
  fetch-and-match:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TED notices
        run: node ted-fetch.js

      - name: Match product to notices
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node match.js "${{ inputs.product }}" 2>&1 | tee run.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rfq-results
          path: |
            results.json
            results-no-deadline.json
            matches.json
            scored-all.json
            run.log
          if-no-files-found: warn
          retention-days: 7
